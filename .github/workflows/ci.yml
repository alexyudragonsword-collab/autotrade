name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install fastapi 'uvicorn[standard]' sqlalchemy pydantic pydantic-settings \
            PyJWT bcrypt pandas numpy apscheduler httpx pyarrow python-multipart alembic \
            pytest pytest-asyncio yfinance
      - name: Run tests
        run: pytest -q
        working-directory: .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: frontend
