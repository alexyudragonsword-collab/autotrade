[project]
name = "autotrade"
version = "0.1.0"
description = "TradingView 自动交易系统：定制选股、策略回测、自动交易、自动提醒"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pyarrow>=15.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 行情数据源（选股/回测需要）
data = [
    "akshare>=1.12",
    "yfinance>=0.2.37",
]
# 实盘券商 SDK（按需安装）
futu = ["futu-api>=7.0"]
ibkr = ["ib_async>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.setuptools]
packages = { find = { where = ["backend"] } }
